# Smart Home Security Check - local / single-host stack
#   cp .env.example .env   # then set real secrets
#   docker compose up -d --build
#   docker compose --profile dev up -d   # also starts Mailpit (fake SMTP, UI on :8025)
name: shsc

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHSC_DB_NAME:?set SHSC_DB_NAME in .env}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      SHSC_DB_MIGRATOR_USER: ${SHSC_DB_MIGRATOR_USER:?}
      SHSC_DB_MIGRATOR_PASSWORD: ${SHSC_DB_MIGRATOR_PASSWORD:?}
      SHSC_DB_APP_USER: ${SHSC_DB_APP_USER:?}
      SHSC_DB_APP_PASSWORD: ${SHSC_DB_APP_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [data]
    # Not published on the host. For local inspection: docker compose exec postgres psql ...

  backend:
    build:
      context: .
      dockerfile: backend/spring-boot-api/Dockerfile
    image: shsc/backend:${SHSC_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHSC_DB_URL: jdbc:postgresql://postgres:5432/${SHSC_DB_NAME}
      SHSC_DB_APP_USER: ${SHSC_DB_APP_USER}
      SHSC_DB_APP_PASSWORD: ${SHSC_DB_APP_PASSWORD}
      SHSC_DB_MIGRATOR_USER: ${SHSC_DB_MIGRATOR_USER}
      SHSC_DB_MIGRATOR_PASSWORD: ${SHSC_DB_MIGRATOR_PASSWORD}
      SHSC_API_DOCS_ENABLED: ${SHSC_API_DOCS_ENABLED:-false}
      SHSC_LOG_LEVEL: ${SHSC_LOG_LEVEL:-INFO}
      SHSC_LOG_FORMAT: ${SHSC_LOG_FORMAT:-ecs}
      SHSC_JWT_PRIVATE_KEY: ${SHSC_JWT_PRIVATE_KEY:?run infrastructure/scripts/generate-jwt-key.sh and set SHSC_JWT_PRIVATE_KEY in .env}
      SHSC_PUBLIC_BASE_URL: ${SHSC_PUBLIC_BASE_URL:?set SHSC_PUBLIC_BASE_URL in .env}
      SHSC_COOKIE_SECURE: ${SHSC_COOKIE_SECURE:-true}
      SHSC_CORS_ALLOWED_ORIGINS: ${SHSC_CORS_ALLOWED_ORIGINS:-}
      SHSC_ACCESS_TOKEN_TTL: ${SHSC_ACCESS_TOKEN_TTL:-PT15M}
      SHSC_REFRESH_TOKEN_TTL: ${SHSC_REFRESH_TOKEN_TTL:-P14D}
      SHSC_SESSION_MAX_LIFETIME: ${SHSC_SESSION_MAX_LIFETIME:-P30D}
      SHSC_MAIL_FROM: ${SHSC_MAIL_FROM:?set SHSC_MAIL_FROM in .env}
      SHSC_SMTP_HOST: ${SHSC_SMTP_HOST:-mailpit}
      SHSC_SMTP_PORT: ${SHSC_SMTP_PORT:-1025}
      SHSC_SMTP_USERNAME: ${SHSC_SMTP_USERNAME:-}
      SHSC_SMTP_PASSWORD: ${SHSC_SMTP_PASSWORD:-}
      SHSC_SMTP_AUTH: ${SHSC_SMTP_AUTH:-false}
      SHSC_SMTP_STARTTLS: ${SHSC_SMTP_STARTTLS:-false}
    networks: [data, edge]

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    image: shsc/nginx:${SHSC_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SHSC_PUBLIC_HOST: ${SHSC_PUBLIC_HOST:-localhost}
      SHSC_TLS_SELF_SIGNED: ${SHSC_TLS_SELF_SIGNED:-false}
    ports:
      - "${SHSC_HTTP_PORT:-80}:80"
      - "${SHSC_HTTPS_PORT:-443}:443"
    volumes:
      - tls-certs:/etc/nginx/tls
    networks: [edge]

  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge]

volumes:
  postgres-data:
  tls-certs:

networks:
  data:
    internal: true
  edge:

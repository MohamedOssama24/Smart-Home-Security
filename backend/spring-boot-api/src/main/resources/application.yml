# All environment-specific values come from environment variables (see /.env.example).
# No secret has a default value: the application refuses to start if one is missing.
spring:
  application:
    name: shsc-api
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime role: DML only, NOSUPERUSER, NOBYPASSRLS (see infrastructure/docker/postgres/init)
    url: ${SHSC_DB_URL}
    username: ${SHSC_DB_APP_USER}
    password: ${SHSC_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${SHSC_DB_POOL_SIZE:10}
  flyway:
    # Migrations run with the dedicated owner role, never with the runtime role
    user: ${SHSC_DB_MIGRATOR_USER}
    password: ${SHSC_DB_MIGRATOR_PASSWORD}
    schemas: shsc
    default-schema: shsc
    create-schemas: false
    locations: classpath:db/migration
    validate-on-migrate: true
    placeholders:
      # runtime role name, used by migrations to GRANT/REVOKE privileges explicitly
      appRole: ${SHSC_DB_APP_USER}
  mail:
    host: ${SHSC_SMTP_HOST:localhost}
    port: ${SHSC_SMTP_PORT:1025}
    username: ${SHSC_SMTP_USERNAME:}
    password: ${SHSC_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SHSC_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SHSC_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
    # apostrophes are always written doubled (MessageFormat), also in texts without arguments
    always-use-message-format: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    # SMTP outages must not mark the API as down (e-mails are retried by the user)
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /api/v1/openapi.json
    enabled: ${SHSC_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /api/v1/docs
    enabled: ${SHSC_API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
    com.shsc: ${SHSC_LOG_LEVEL:INFO}
  structured:
    format:
      console: ${SHSC_LOG_FORMAT:ecs}

# ---------------------------------------------------------------------------
# Smart Home Security Check (Milestone 3: authentication, sessions, agents)
# ---------------------------------------------------------------------------
shsc:
  # Public URL of the dashboard, used to build links in e-mails
  public-base-url: ${SHSC_PUBLIC_BASE_URL}
  mail:
    from: ${SHSC_MAIL_FROM}
  security:
    jwt:
      # base64 of a PKCS#8 DER EC P-256 private key (infrastructure/scripts/generate-jwt-key.sh)
      private-key: ${SHSC_JWT_PRIVATE_KEY}
      issuer: shsc-api
      audience: shsc-web
      access-token-ttl: ${SHSC_ACCESS_TOKEN_TTL:PT15M}
    session:
      refresh-token-ttl: ${SHSC_REFRESH_TOKEN_TTL:P14D}
      max-lifetime: ${SHSC_SESSION_MAX_LIFETIME:P30D}
      cookie-name: shsc_rt
      cookie-secure: ${SHSC_COOKIE_SECURE:true}
    tokens:
      email-verification-ttl: P1D
      password-reset-ttl: PT30M
      # invitation of a new user by an administrator (link to choose the password)
      invitation-ttl: P7D
    throttle:
      # failed logins per account (hashed e-mail) before a temporary, progressive lock
      account-max-failures: 5
      account-base-lock: PT1M
      account-max-lock: PT1H
      # failed logins per client IP
      ip-max-failures: 30
      ip-lock: PT15M
      window: PT15M
      # e-mail sending endpoints (register, forgot password, resend verification) per IP
      mail-requests-per-window: 10
    cors:
      # comma separated list of extra origins allowed to call the API (empty = same origin only)
      allowed-origins: ${SHSC_CORS_ALLOWED_ORIGINS:}
    maintenance:
      purge-retention: P7D
      purge-interval: PT1H
  agent:
    enrollment-token-ttl: PT30M
    access-token-ttl: PT10M
    assertion-max-lifetime: PT60S
    clock-skew: PT30S
    assertion-audience: shsc-agent-token
    rotation-audience: shsc-agent-rotate
    # below 30 s so that a revoked agent notices it within 30 s (docs/03-AGENT-PROTOCOL.md §5)
    heartbeat-interval: PT25S
  scans:
    # base64 PKCS#8 DER Ed25519 private key that signs the scan jobs
    # (infrastructure/scripts/generate-job-signing-key.sh); agents pin its public key
    job-signing-key: ${SHSC_JOB_SIGNING_KEY}
    # a queued job not collected by the agent within this time fails (AGENT_OFFLINE)
    queue-ttl: PT10M
    # renewed by every progress report; when it expires the scan fails (AGENT_LOST)
    lease: PT2M
    max-duration: PT15M
    # results of a scan failed with AGENT_LOST are still accepted for this long (LATE_UPLOAD)
    late-upload-window: P1D
    # maximum wait of GET /agent/jobs/next
    long-poll-max: PT25S
    progress-interval: PT5S
    reaper-interval: PT30S
  alerts:
    # pending alert e-mails are sent by a periodic job (retried after 5 and 15 minutes)
    dispatch-interval: ${SHSC_ALERT_DISPATCH_INTERVAL:PT30S}
    # active agents without heartbeat for 15 minutes raise AGENT_OFFLINE
    agent-check-interval: PT1M
  push:
    fcm:
      # Firebase project of the owner (free FCM). Empty = push disabled: no PUSH delivery is created.
      project-id: ${SHSC_FCM_PROJECT_ID:}
      # service-account JSON downloaded from the Firebase console, mounted as a secret file
      credentials-file: ${SHSC_FCM_CREDENTIALS_FILE:}
      endpoint: https://fcm.googleapis.com
  assistant:
    # LOCAL = deterministic answers built from the tenant data (default, offline, free).
    # OLLAMA = local LLM (free, self-hosted); its answers are checked for grounding, LOCAL is the fallback.
    provider: ${SHSC_ASSISTANT_PROVIDER:LOCAL}
    max-per-user-per-minute: 20
    ollama:
      url: ${SHSC_OLLAMA_URL:}
      model: ${SHSC_OLLAMA_MODEL:llama3.2}
      timeout: PT30S
  billing:
    stripe:
      # Stripe (ADR-072). Empty secret key or webhook secret = online subscriptions disabled (plans set by
      # hand). Only test keys (sk_test_/rk_test_) are accepted unless allow-live=true.
      secret-key: ${SHSC_STRIPE_SECRET_KEY:}
      webhook-secret: ${SHSC_STRIPE_WEBHOOK_SECRET:}
      price-plus: ${SHSC_STRIPE_PRICE_PLUS:}
      price-pro: ${SHSC_STRIPE_PRICE_PRO:}
      allow-live: ${SHSC_STRIPE_ALLOW_LIVE:false}
      # free trial in days offered once per tenant at checkout (0 = no trial, max 730)
      trial-days: ${SHSC_STRIPE_TRIAL_DAYS:0}
      api-url: https://api.stripe.com
      webhook-tolerance: PT5M
  reports:
    # PDF reports of a home generated in the last 24 hours (limit until the plans of M17)
    max-per-home-per-day: 20
  oui:
    # public IEEE registration authority files; downloaded only on request of a platform administrator
    sources: ${SHSC_OUI_SOURCES:https://standards-oui.ieee.org/oui/oui.csv,https://standards-oui.ieee.org/oui28/mam.csv,https://standards-oui.ieee.org/oui36/oui36.csv}
    max-bytes: 16777216
    timeout: PT60S
  vulnerabilities:
    # public feeds (NVD CVE API 2.0, CISA KEV, FIRST EPSS); downloaded only on request of a platform administrator
    nvd-url: ${SHSC_NVD_URL:https://services.nvd.nist.gov/rest/json/cves/2.0}
    kev-url: ${SHSC_KEV_URL:https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
    epss-url: ${SHSC_EPSS_URL:https://api.first.org/data/v1/epss}
    # optional free NVD API key (sent as the apiKey header, never logged)
    nvd-api-key: ${SHSC_NVD_API_KEY:}
    # NVD public rate limit: 5 requests / 30 s without a key
    nvd-request-delay: ${SHSC_NVD_REQUEST_DELAY:PT6S}
    max-bytes: 33554432
    timeout: PT60S
    max-pages-per-product: 10

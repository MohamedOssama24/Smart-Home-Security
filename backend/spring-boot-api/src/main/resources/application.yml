# All environment-specific values come from environment variables (see /.env.example).
# No secret has a default value: the application refuses to start if one is missing.
spring:
  application:
    name: shsc-api
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime role: DML only, NOSUPERUSER, NOBYPASSRLS (see infrastructure/docker/postgres/init)
    url: ${SHSC_DB_URL}
    username: ${SHSC_DB_APP_USER}
    password: ${SHSC_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${SHSC_DB_POOL_SIZE:10}
  flyway:
    # Migrations run with the dedicated owner role, never with the runtime role
    user: ${SHSC_DB_MIGRATOR_USER}
    password: ${SHSC_DB_MIGRATOR_PASSWORD}
    schemas: shsc
    default-schema: shsc
    create-schemas: false
    locations: classpath:db/migration
    validate-on-migrate: true
    placeholders:
      # runtime role name, used by migrations to GRANT/REVOKE privileges explicitly
      appRole: ${SHSC_DB_APP_USER}
  mail:
    host: ${SHSC_SMTP_HOST:localhost}
    port: ${SHSC_SMTP_PORT:1025}
    username: ${SHSC_SMTP_USERNAME:}
    password: ${SHSC_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SHSC_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SHSC_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    # SMTP outages must not mark the API as down (e-mails are retried by the user)
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /api/v1/openapi.json
    enabled: ${SHSC_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /api/v1/docs
    enabled: ${SHSC_API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
    com.shsc: ${SHSC_LOG_LEVEL:INFO}
  structured:
    format:
      console: ${SHSC_LOG_FORMAT:ecs}

# ---------------------------------------------------------------------------
# Smart Home Security Check (Milestone 3: authentication, sessions, agents)
# ---------------------------------------------------------------------------
shsc:
  # Public URL of the dashboard, used to build links in e-mails
  public-base-url: ${SHSC_PUBLIC_BASE_URL}
  mail:
    from: ${SHSC_MAIL_FROM}
  security:
    jwt:
      # base64 of a PKCS#8 DER EC P-256 private key (infrastructure/scripts/generate-jwt-key.sh)
      private-key: ${SHSC_JWT_PRIVATE_KEY}
      issuer: shsc-api
      audience: shsc-web
      access-token-ttl: ${SHSC_ACCESS_TOKEN_TTL:PT15M}
    session:
      refresh-token-ttl: ${SHSC_REFRESH_TOKEN_TTL:P14D}
      max-lifetime: ${SHSC_SESSION_MAX_LIFETIME:P30D}
      cookie-name: shsc_rt
      cookie-secure: ${SHSC_COOKIE_SECURE:true}
    tokens:
      email-verification-ttl: P1D
      password-reset-ttl: PT30M
      # invitation of a new user by an administrator (link to choose the password)
      invitation-ttl: P7D
    throttle:
      # failed logins per account (hashed e-mail) before a temporary, progressive lock
      account-max-failures: 5
      account-base-lock: PT1M
      account-max-lock: PT1H
      # failed logins per client IP
      ip-max-failures: 30
      ip-lock: PT15M
      window: PT15M
      # e-mail sending endpoints (register, forgot password, resend verification) per IP
      mail-requests-per-window: 10
    cors:
      # comma separated list of extra origins allowed to call the API (empty = same origin only)
      allowed-origins: ${SHSC_CORS_ALLOWED_ORIGINS:}
    maintenance:
      purge-retention: P7D
      purge-interval: PT1H
  agent:
    enrollment-token-ttl: PT30M
    access-token-ttl: PT10M
    assertion-max-lifetime: PT60S
    clock-skew: PT30S
    assertion-audience: shsc-agent-token
    rotation-audience: shsc-agent-rotate

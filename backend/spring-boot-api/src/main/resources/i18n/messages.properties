report.scoreExplained=Il punteggio va da 0 a 100: 100 significa che non sono stati trovati problemi noti. Dipende da ciò che la scansione ha potuto controllare, per questo è sempre accompagnato dalla copertura.
report.coverage=Copertura dell''analisi: {0}% ({1} dispositivi analizzati su {2} trovati)
report.provisional=Punteggio provvisorio: la copertura è bassa, quindi potrebbero esserci rischi non rilevati.
report.notComputed=Punteggio non calcolato: questa scansione (Solo rilevamento) non controlla porte e servizi. Per un punteggio esegui una scansione Rapida o Standard.

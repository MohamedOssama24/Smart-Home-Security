report.section.limits=Limiti dell''analisi
report.limits.1=L''analisi vede solo le reti a cui è collegato l''agent: reti separate (ospiti, VLAN, IoT) non sono controllate se l''agent non è presente.
report.limits.2=I dispositivi spenti, in standby o isolati dal Wi-Fi possono non rispondere durante la scansione.
report.limits.3=Dispositivi Zigbee, Z-Wave, Bluetooth e Thread non sono visibili: non usano la rete IP.
report.limits.4=Modello e versione del firmware spesso non sono esposti: in questi casi un problema è indicato come potenziale e non come confermato. Le informazioni dichiarate dai dispositivi possono essere inesatte.
report.limits.5=Dall''interno della casa non è possibile sapere con certezza cosa è raggiungibile da Internet: sono note solo le aperture automatiche (UPnP) dichiarate dal router.
report.limits.6=La scansione non prova password, non sfrutta vulnerabilità e non modifica i dispositivi: un risultato pulito non garantisce l''assenza di rischi.

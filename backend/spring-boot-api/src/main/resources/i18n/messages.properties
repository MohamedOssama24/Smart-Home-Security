mail.verify-email.subject=Conferma il tuo indirizzo email - Smart Home Security Check
mail.verify-email.body=Ciao {0},\n\nper attivare il tuo account Smart Home Security Check apri questo link entro 24 ore:\n\n{1}\n\nSe non hai creato tu l''account puoi ignorare questo messaggio.\n
mail.reset-password.subject=Reimposta la password - Smart Home Security Check
mail.reset-password.body=Ciao {0},\n\nabbiamo ricevuto una richiesta di reimpostazione della password. Il link vale 30 minuti e si può usare una sola volta:\n\n{1}\n\nSe non sei stato tu, ignora questo messaggio: la tua password resta invariata.\n
mail.account-exists.subject=Tentativo di registrazione - Smart Home Security Check
mail.account-exists.body=Ciao {0},\n\nqualcuno ha provato a registrare un nuovo account con il tuo indirizzo email, che è già registrato.\nSe sei stato tu e non ricordi la password puoi reimpostarla qui:\n\n{1}\n\nSe non sei stato tu, ignora questo messaggio.\n
mail.invitation.subject=Invito a {3} - Smart Home Security Check
mail.invitation.body=Ciao {0},\n\n{2} ti ha invitato a usare Smart Home Security Check per {3}.\nPer attivare l''account scegli una password da questo link (valido {4} giorni, utilizzabile una sola volta):\n\n{1}\n\nSe non aspettavi questo invito puoi ignorare il messaggio: senza la tua conferma l''account non viene attivato.\n

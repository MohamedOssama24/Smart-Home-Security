report.section.limits=Limits of the analysis
report.limits.1=The analysis only sees the networks the agent is connected to: separate networks (guest, VLAN, IoT) are not checked without an agent there.
report.limits.2=Devices that are off, in standby or isolated by the Wi-Fi may not answer during the scan.
report.limits.3=Zigbee, Z-Wave, Bluetooth and Thread devices are not visible: they do not use the IP network.
report.limits.4=Model and firmware version are often not exposed: in these cases an issue is reported as potential, not confirmed. Information declared by the devices may be inaccurate.
report.limits.5=From inside the home it is not possible to know for sure what is reachable from the Internet: only the automatic openings (UPnP) declared by the router are known.
report.limits.6=The scan does not try passwords, does not exploit vulnerabilities and does not change the devices: a clean result does not guarantee the absence of risks.

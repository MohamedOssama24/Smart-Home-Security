mail.verify-email.subject=Confirm your e-mail address - Smart Home Security Check
mail.verify-email.body=Hi {0},\n\nto activate your Smart Home Security Check account open this link within 24 hours:\n\n{1}\n\nIf you did not create the account you can ignore this message.\n
mail.reset-password.subject=Reset your password - Smart Home Security Check
mail.reset-password.body=Hi {0},\n\nwe received a request to reset your password. The link is valid for 30 minutes and can be used only once:\n\n{1}\n\nIf it was not you, ignore this message: your password stays unchanged.\n
mail.account-exists.subject=Registration attempt - Smart Home Security Check
mail.account-exists.body=Hi {0},\n\nsomeone tried to register a new account with your e-mail address, which is already registered.\nIf it was you and you do not remember the password you can reset it here:\n\n{1}\n\nIf it was not you, ignore this message.\n
mail.invitation.subject=Invitation to {3} - Smart Home Security Check
mail.invitation.body=Hi {0},\n\n{2} invited you to use Smart Home Security Check for {3}.\nTo activate the account choose a password with this link (valid for {4} days, single use):\n\n{1}\n\nIf you were not expecting this invitation you can ignore this message: the account is not activated without your confirmation.\n

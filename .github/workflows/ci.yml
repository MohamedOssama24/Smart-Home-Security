name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/spring-boot-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Testcontainers PostgreSQL 18)
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/angular-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/angular-dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      - name: E2E (Playwright, [MOCK] API)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/go-security-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/shsc-agent
          done
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  mobile:
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    defaults:
      run:
        working-directory: mobile/shsc_app
    steps:
      - uses: actions/checkout@v4
      - run: flutter pub get
      - run: flutter analyze
      - name: Widget, unit and integration tests ([MOCK] API on localhost)
        run: flutter test
      - name: Android build (debug, no Firebase configuration)
        run: flutter build apk --debug

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: cp .env.example .env && docker compose config -q
      - name: Validate Nginx configuration
        run: |
          docker build -f infrastructure/nginx/Dockerfile -t shsc/nginx:ci .
          docker run --rm --add-host backend:127.0.0.1 -e SHSC_TLS_SELF_SIGNED=true shsc/nginx:ci \
            sh -c '/docker-entrypoint.d/10-tls-certificate.sh && nginx -t'
      - name: Secret scanning (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact

server_tokens off;

# Edge rate limiting per client IP (the backend applies finer per-user/tenant/agent limits)
limit_req_zone $binary_remote_addr zone=shsc_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=shsc_auth:10m rate=30r/m;
limit_req_status 429;

upstream shsc_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /nginx-health { return 204; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 4m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    # Public, minimal backend health (used by the dashboard system status)
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
        proxy_pass http://shsc_backend/actuator/health;
    }

    # Actuator is never exposed publicly
    location /actuator/ { return 404; }

    location /api/v1/auth/ {
        limit_req zone=shsc_auth burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
        proxy_pass http://shsc_backend;
    }

    location /api/ {
        limit_req zone=shsc_api burst=40 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
        proxy_pass http://shsc_backend;
    }

    # Angular SPA
    root /usr/share/nginx/html;

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /i18n/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri /index.html;
    }
}
